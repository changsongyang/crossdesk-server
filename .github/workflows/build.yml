name: Build CrossDesk Server

on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            artifact_name: crossdesk_server-linux-amd64
          - arch: arm64
            platform: linux/arm64
            artifact_name: crossdesk_server-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.arch }} binary artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          platforms: ${{ matrix.platform }}
          target: artifact
          outputs: type=local,dest=./dist

      - name: Rename built binary
        run: |
          mv ./dist/crossdesk_server ./dist/${{ matrix.artifact_name }}
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ./dist/${{ matrix.artifact_name }}

  docker-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:latest

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crossdesk_server-linux-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/crossdesk_server-linux-amd64
            dist/crossdesk_server-linux-arm64
          generate_release_notes: true
