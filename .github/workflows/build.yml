name: Build CrossDesk Server

on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  validate-deployment:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate shell scripts and Compose configuration
        shell: bash
        env:
          COTURN_AUTH_SECRET: ci-validation-only-not-for-production
          COTURN_STATELESS_NONCE_SECRET: ci-validation-only-not-for-production
        run: |
          bash -n docker/start.sh docker/generate_certs.sh
          docker compose --env-file .env.example config --quiet

  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            artifact_name: crossdesk_server-linux-amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact_name: crossdesk_server-linux-arm64

    container:
      image: ubuntu:22.04
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            gnupg \
            software-properties-common \
            git \
            curl \
            unzip \
            build-essential

      - name: Install xmake
        shell: bash
        run: |
          add-apt-repository -y ppa:xmake-io/xmake
          apt-get update
          apt-get install -y --no-install-recommends xmake

      - name: Build ${{ matrix.arch }} binary
        env:
            XMAKE_GLOBALDIR: /data
            XMAKE_ROOT: y
        shell: bash
        run: |
          xmake f -m release --root -y
          xmake b --root -vy crossdesk_server
          BINARY_PATH="$(find build -type f -path '*/release/crossdesk_server' | head -n 1)"
          test -n "${BINARY_PATH}"
          mkdir -p dist
          cp "${BINARY_PATH}" "./dist/${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ./dist/${{ matrix.artifact_name }}
          compression-level: 0

  docker-build-check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref_name != github.event.repository.default_branch }}
    needs: [validate-deployment, build]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download amd64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: crossdesk_server-linux-amd64
          path: dist

      - name: Prepare runtime binary path
        shell: bash
        run: |
          mv ./dist/crossdesk_server-linux-amd64 ./dist/crossdesk_server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate CrossDesk Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          platforms: linux/amd64
          push: false
          tags: crossdesk/crossdesk-server:ci
          cache-from: type=gha,scope=crossdesk-server-amd64
          cache-to: type=gha,scope=crossdesk-server-amd64,mode=max

  docker-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref_name == github.event.repository.default_branch }}
    needs: [validate-deployment, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
            artifact_name: crossdesk_server-linux-amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            artifact_name: crossdesk_server-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download ${{ matrix.arch }} binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist

      - name: Prepare runtime binary path
        shell: bash
        run: |
          mv "./dist/${{ matrix.artifact_name }}" ./dist/crossdesk_server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push test Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:test-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:buildcache-test-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:buildcache-test-${{ matrix.arch }},mode=max

  docker-test-manifest:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref_name == github.event.repository.default_branch }}
    needs: docker-test
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create test multi-arch manifest
        shell: bash
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server

          docker buildx imagetools create \
            -t ${IMAGE_NAME}:test \
            ${IMAGE_NAME}:test-amd64 \
            ${IMAGE_NAME}:test-arm64

  docker-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-deployment, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
            artifact_name: crossdesk_server-linux-amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            artifact_name: crossdesk_server-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download ${{ matrix.arch }} binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist

      - name: Prepare runtime binary path
        shell: bash
        run: |
          mv "./dist/${{ matrix.artifact_name }}" ./dist/crossdesk_server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:${{ github.ref_name }}-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:latest-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server:buildcache-${{ matrix.arch }},mode=max

  docker-manifest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: docker-release
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests
        shell: bash
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server

          docker buildx imagetools create \
            -t ${IMAGE_NAME}:${GITHUB_REF_NAME} \
            ${IMAGE_NAME}:${GITHUB_REF_NAME}-amd64 \
            ${IMAGE_NAME}:${GITHUB_REF_NAME}-arm64

          docker buildx imagetools create \
            -t ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:latest-amd64 \
            ${IMAGE_NAME}:latest-arm64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker-manifest]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crossdesk_server-linux-*
          path: dist
          merge-multiple: true

      - name: Prepare deployment assets
        shell: bash
        env:
          CROSSDESK_IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/crossdesk-server
        run: |
          cp compose.yaml dist/compose.yaml
          sed \
            "s|^CROSSDESK_IMAGE=.*|CROSSDESK_IMAGE=${CROSSDESK_IMAGE_REPOSITORY}:${GITHUB_REF_NAME}|" \
            .env.example > dist/env.example
          grep -F "CROSSDESK_IMAGE=${CROSSDESK_IMAGE_REPOSITORY}:${GITHUB_REF_NAME}" dist/env.example

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/crossdesk_server-linux-amd64
            dist/crossdesk_server-linux-arm64
            dist/compose.yaml
            dist/env.example
          generate_release_notes: true
